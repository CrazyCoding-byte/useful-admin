server:
  port: 8890
  base-url: "http://localhost:8890"

# 数据库配置（复用 IM 模块的 DatabaseConfig 结构）
database:
  driver: "mysql"
  host: "localhost"
  port: 3306
  username: "root"
  password: "password"
  dbname: "xz"
  charset: "utf8mb4"

# 日志配置（复用 IM 模块的 LogConfig 结构）
log:
  path: "./logs/app.log"
  level: "info"
  format: "text"
  max_size: 10

# 对称加密密钥（复用 IM 模块的 AESConfig 结构）。
# 注意：IM 模块 YAML 节点名是 aseKey（历史拼写），所以这里必须与 IM 保持一致，
# 否则 IM 的鉴权中间件读取不到密钥。
# 密钥必须与 auth-server 的 AES.key 完全一致（16 字节 AES-128），
# 之前配置的 41 字符长字符串不是合法 AES 密钥，会导致 Token 解密失败。
aseKey:
  key: "yangzhixuan94416"

# MinIO 配置（复用 IM 模块的 MinIOConfig 结构）。
# 指向虚拟机上的 MinIO（AIStor，与 im 模块共用同一实例）。
minio:
  endpoint: "192.168.56.129:19000"
  access-key-id: "minio"
  secret-access-key: "QWEasd123"
  bucket-name: "video"
  use-ssl: false
  # 注意：chunk-size / max-file-size 单位是 **MB**（代码内部会 *1024*1024 转字节），
  # 之前误填成字节（10485760 / 209715200），导致 chunkSizeBytes 被算成 10TB，
  # 总分片数变成 1，单片上传反而失败。
  chunk-size: 10            # 单分片大小 10MB
  max-file-size: 2048      # 最大文件大小 2048MB（2GB，覆盖绝大多数教学视频）
  redis-prefix: "minio:"
  expire-time: 24h

# Redis 配置（复用 IM 模块的 RedisConfig 结构）
redis:
  host: "localhost"
  port: 6379
  password: ""

# 文件配置（复用 IM 模块的 FileConfig 结构，video 业务当前未使用，保留默认值）
file:
  upload-baseUrl: "file-storage"
  max-file-size: 200
  max-chunk-size: 5

# 重试配置（复用 IM 模块的 Retry 结构，video 业务当前未使用，保留默认值）
retry:
  max-retries: 3
  retry-delay: 1s

# 视频处理配置（video 模块专属）
video:
  # 临时工作目录（切片、转码用）
  work-dir: "./tmp/video"
  # HLS 切片时长（秒）
  hls-segment-time: 10
  # 试看默认秒数
  default-trial-seconds: 30
  # 历史弹幕条数
  danmaku-history-limit: 100
  # 弹幕 Redis 发布订阅频道前缀
  danmaku-redis-channel: "danmaku:video:"

# ZLMediaKit 直播服务器配置（video 模块专属）
zlmediakit:
  # ZLMediaKit HTTP API 地址，调用 /index/api/* 时使用
  host: "localhost:6080"
  # ZLMediaKit 配置文件 general.adminParamsSecret，用于调用管理 API
  secret: "035c73f7-bb6b-4889-a715-d9eb2d1925cc"
  # OBS 推流 RTMP 基础地址，流名称为直播间 stream_id
  rtmp-push-host: "rtmp://localhost/live"
  # HTTP 播放基础地址，小程序/H5 用 HTTP-FLV 或 HLS 播放
  http-playback-url: "http://localhost:6080"
  # 是否启用 webhook 回调（需要在 ZLMediaKit 配置中开启 hook）
  enable-webhook: true
  # webhook 校验密钥，防止伪造推流/断流事件
  webhook-secret: "video-webhook-secret-2026"
