syntax = "proto3";

package filestorage;

option go_package = "local/im/proto/filestorage";

// 文件存储服务
service FileStorageService {
  // 上传文件（流式传输，支持大文件）
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);

  // 从URL上传文件
  rpc UploadFileFromUrl(UploadFileFromUrlRequest) returns (UploadFileResponse);

  // 获取文件详情
  rpc GetFileDetail(GetFileDetailRequest) returns (FileDetailResponse);

  // 新的分片上传接口
  rpc UploadFileChunked(stream FileChunk) returns (UploadFileResponse);
  rpc CompleteChunkedUpload(CompleteUploadRequest) returns (UploadFileResponse);
}

// 上传文件请求（流式）- 保持兼容
message UploadFileRequest {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

// 新的分片上传消息
message FileChunk {
  string upload_id = 1;        // 上传会话ID
  int32 chunk_index = 2;       // 分片索引
  int32 total_chunks = 3;      // 总分片数
  bytes data = 4;              // 分片数据
  string file_name = 5;        // 文件名（第一个分片携带）
  string mime_type = 6;        // MIME类型
  string file_system_type = 7; // 文件系统类型
  string file_hash = 8;       //文件总体hash
}

message CompleteUploadRequest {
  string upload_id = 1;
  string file_name = 2;
  string mime_type = 3;
  string file_system_type = 4;
  string file_hash = 5;        // 最终文件哈希（可选校验）
}

// 文件元数据
message FileMetadata {
  string file_system_type = 1;
  string file_name = 2;
  string mime_type = 3;
  int64 file_size = 4;
}

// 从URL上传文件请求
message UploadFileFromUrlRequest {
  string file_system_type = 1;
  string download_url = 2;
  string mime_type = 3;
  string file_name = 4;
}

// 获取文件详情请求
message GetFileDetailRequest {
  string file_hash = 1;
  string file_system_type = 2;
}

// 文件详情响应
message FileDetailResponse {
  int64 id = 1;
  string file_name = 2;
  string file_type = 3;
  string file_hash = 4;
  string file_path = 5;
  int64 file_size = 6;
  int64 uploader = 7;
  string file_system_type = 8;
  string created_at = 9;
  string updated_at = 10;
}

// 上传文件响应
message UploadFileResponse {
  bool success = 1;
  string message = 2;
  FileDetailResponse file_detail = 3;
  string upload_id = 4;        // 返回上传ID用于分片上传
}