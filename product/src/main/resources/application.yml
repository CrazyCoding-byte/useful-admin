eureka:
  client:
    serviceUrl:
      #配置服务中心(可配置多个,用逗号隔开)
      defaultZone: http://admin:admin@localhost:9000/eureka/
spring:
  redis:
    port: 6379
    host: localhost
  datasource:
    password: yangzhixuan
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gulimall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
  rabbitmq:
    host: 192.168.56.129
    port: 5672
    publisher-returns: true # 开启返回机制
    publisher-confirm-type: correlated # 开启确认机制
    template:
      mandatory: true  #强制返回未路由的消息（否则直接丢弃）
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3 # 消费线程数
        max-concurrency: 10 # 最大消费线程数
        retry:
          enabled: true # 开启重试
          max-attempts: 3 #最大重试次数
          initial-interval: 1000ms # 初始重试间隔
  elasticsearch:
    rest:
      uris: http://192.168.56.129:9200