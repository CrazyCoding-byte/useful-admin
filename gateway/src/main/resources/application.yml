auth:
  allowed-origins: http://localhost:8080
server:
  port: 9100
spring:
  application:
    name: oauth2-gateway
  cloud:
    gateway:
      routes:
        # 认证服务路由（登录、获取Token等）
        - id: auth-server
          uri: lb://auth-server  # 使用服务名（需配合eureka）
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0  # 转发时保留/auth前缀

