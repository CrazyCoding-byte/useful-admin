eureka:
  client:
    serviceUrl:
      #配置服务中心(可配置多个,用逗号隔开)
      defaultZone: http://admin:admin@localhost:9000/eureka/
      logging:
        level:
          org.springframework.cloud.gateway: DEBUG
encrypt:
  key-store:
    location: classpath:/xz.keystore
    secret: xiaozuokeystore
    alias: xzkey
    password: xiaozuo
auth:
  allowed-origins: http://localhost:8080
server:
  port: 9100
spring:
  application:
    name: oauth2-gateway
  cloud:
    gateway:
      routes:
        # 认证服务路由（登录、获取Token等）
        - id: auth-server
          uri: lb://auth-server  # 使用服务名（需配合eureka）
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0  # 转发时保留/auth前缀
        - id: system-server
          uri: lb://system-server
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=0  # 转发时保留/system前缀
        - id: product-server
          uri: lb://product-server
          predicates:
            - Path=/product/**
        - id: wms-server
          uri: lb://wms-server
          predicates:
            - Path=/wms/**
        - id: coupon-server
          uri: lb://coupon-server
          predicates:
            - Path=/coupon/**
        - id: scan_route
          uri: no://op
          predicates:
            - Path=/gateway/scan/**

